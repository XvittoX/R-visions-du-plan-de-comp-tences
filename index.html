<script>
const D=[
{n:"S1 · Cadre légal",s:[
{t:"1. Enjeux et rôle stratégique",u:["<b>Mutations</b> : IA et digital (durée de vie d’une compétence technique ramenée à ~2 ans), transition écologique et RSE, démographie (carrières plus longues), attentes des salariés (sens, employabilité).","<b>Le PDC</b> est le point d’équilibre entre la compétitivité de l’entreprise et la valeur professionnelle du salarié : c’est le « bras armé » de la <b>GEPP</b>.","<b>Modèle d’Ulrich</b> : partenaire stratégique, agent du changement, expert administratif, champion des salariés.","<b>Subi vs choisi</b> : sans anticipation, l’IA crée du chômage technologique ; avec un PDC, elle permet la montée en qualification."],e:"Dans le modèle d’Ulrich, un RH qui anticipe l’impact de l’IA via le PDC joue le rôle de partenaire stratégique et d’agent du changement."},
{t:"2. Concepts clés",u:["<b>Compétence (Brien)</b> : combinaison de savoirs, savoir-faire (hard skills) et savoir-être (soft skills), mobilisés en situation et toujours évaluables.","<b>Employabilité</b> : capacité à conserver un emploi ou à en retrouver un.","<b>Apprenance</b> : posture continue d’acquisition de connaissances tout au long de la vie.","<b>Réformes</b> : 1971 « payer ou former » ; 2004/2009 DIF et entretien professionnel ; 2014 CPF ; <b>2018</b> plan de formation → PDC, CPF en euros, OPCA → OPCO, label Qualiopi."],e:"Savoir = connaître le RGPD ; savoir-faire = paramétrer un outil ; savoir-être = écoute et adaptabilité."},
{t:"3. La double obligation (art. L. 6321-1)",u:["<b>1. Adaptation au poste</b> (court terme) : permettre d’exercer les missions du contrat.","<b>2. Maintien de l’employabilité</b> (moyen/long terme) : éviter l’obsolescence des qualifications face aux évolutions des emplois, technologies et organisations.","<b>Formations obligatoires</b> (art. L. 6321-2, imposées par un texte : CACES, habilitation électrique, SST) : sur temps de travail, salaire maintenu, refus impossible (faute professionnelle).","<b>Formations non obligatoires</b> (développement des compétences) : sur temps de travail, ou hors temps si accord ; refus possible si hors temps."],e:"Un salarié formé 2 h seulement sur un nouvel ERP puis sanctionné : risque de licenciement sans cause réelle et sérieuse pour manquement à l’obligation d’adaptation."},
{t:"4. L’EPP : rythme 1-4-8",u:["<b>Entretien de Parcours Professionnel</b> (application finale au 1er octobre 2026), tourné vers l’avenir.","<b>Rythme 1-4-8</b> : entretien initial dans l’année suivant l’embauche ; entretien tous les <b>4 ans</b> ; bilan récapitulatif tous les <b>8 ans</b>.","<b>5 thèmes</b> : compétences et qualifications, trajectoire (focus 45 et 60 ans), besoins de formation, souhaits et projets, dispositifs d’État (CPF, VAE, CEP).","<b>Entretien de retour</b> après suspension prolongée (maternité, parental, arrêt &gt; 6 mois), sauf EPP datant de moins d’un an.","<b>Interdit</b> : évaluer la performance ou fixer des objectifs chiffrés (c’est le rôle de l’entretien annuel d’évaluation, à garder distinct)."],e:"EAE = évalue l’année passée ; EPP = compétences et évolution future."},
{t:"5. Bilan à 8 ans et sanctions",u:["<b>3 critères</b> : totalité des entretiens périodiques ; <b>au moins une formation non obligatoire</b> ; traçabilité écrite (synthèse émargée et remise au salarié).","<b>Entreprise de 50 salariés et plus</b> : abondement correctif de <b>3 000 €</b> sur le CPF du salarié (versé à la Caisse des Dépôts) ; majoration de 100 % (6 000 €) en cas de contrôle et non-régularisation.","<b>Moins de 50 salariés</b> : dommages et intérêts aux prud’hommes pour manquement à l’obligation d’adaptation.","<b>3 réflexes RH</b> : distinguer EAE et EPP ; inclure des formations non obligatoires pour toutes les catégories (notamment ouvriers/employés) ; archiver convocations, comptes rendus et attestations (10 ans)."],e:"Les formations obligatoires de sécurité ne valident pas le bilan à 8 ans."},
{t:"6. CPF et Qualiopi",u:["<b>CPF</b> : droit personnel et universel géré par la Caisse des Dépôts ; utilisable hors temps de travail librement, ou sur temps de travail avec accord de l’employeur.","<b>Qualiopi</b> : certification obligatoire de l’organisme de formation pour que l’action soit financée par des fonds publics ou mutualisés (OPCO, CPF, Régions, France Travail)."],e:"Cas AXYLIA (120 salariés, aucun entretien depuis 5 ans) : manquements = absence d’entretiens (risque d’abondement) et traçabilité insuffisante des formations d’adaptation (sécurité informatique). Actions PDC : sécurité informatique et RGPD (obligatoire), outils projets (obligatoire), parcours d’intégration et tutorat (non obligatoire)."},
{t:"7. Cas d’ouverture : l’IA et les métiers",u:["<b>Situation</b> : 30 collaborateurs de fonctions support (gestionnaires de paie débutants, assistants de saisie, chargés de recrutement juniors) ; la direction veut intégrer IA générative et automatisation d’ici 1 an.","<b>1. Diagnostic GEPP</b> : les tâches répétitives (saisie, tri de CV, calculs de paie standard) risquent l’obsolescence.","<b>2. Compétences cibles</b> : <i>hard skills</i> (prompting, contrôle et audit des sorties de l’IA, analyse de données) et <i>soft skills</i> (conseil, relation, esprit critique, adaptabilité).","<b>3. Action collective prioritaire</b> : parcours « travailler avec l’IA » inscrit au PDC, pour éviter les licenciements.","<b>Rappel légal</b> : maintien de l’employabilité face à l’évolution des technologies (art. L. 6321-1)."],e:"Les 3 finalités du cadre légal : <b>économique</b> (adapter les qualifications, réduire les coûts d’erreurs), <b>sociale</b> (droit à la formation tout au long de la vie, art. L. 6111-1, sécuriser les transitions), <b>RH et stratégique</b> (aligner les compétences sur la GEPP, fidéliser, marque employeur)."},
{t:"8. Cas Trans-Logistique 44 : diagnostic",u:["<b>Entreprise</b> : PME de transport et entreposage de 85 salariés (15 agents de quai/caristes, 8 agents de planning/saisie, 4 chefs d’équipe, 58 conducteurs), ouverte 6 jours sur 7.","<b>Situation</b> : nouvel ERP/WMS depuis 3 mois ; erreurs de saisie +35 %, retards, litiges clients, perte de 18 000 € sur le trimestre ; deux démissions et des arrêts maladie courts.","<b>Position de la direction</b> : « le personnel est de mauvaise volonté », sanctions envisagées.","<b>Cause technique (savoir-faire)</b> : formation initiale de 2 h, démonstration descendante sans pratique en situation réelle.","<b>Cause managériale (savoir-être)</b> : chefs d’équipe qui gèrent par la contrainte, jamais formés au management de transition.","<b>Cause organisationnelle</b> : pas de double contrôle ni de référent interne expert."],e:"Réflexe d’examen : avant de sanctionner, chercher la cause racine sur trois plans (technique, managérial, organisationnel)."},
{t:"9. Trans-Logistique 44 : plan d’action et argumentaire",u:["<b>Action 1 – Perfectionnement ERP et bonnes pratiques de saisie</b> : 8 agents de saisie + 4 agents de quai référents ; objectif : moins de 2 % d’erreurs ; modalité mixte/AFEST (ateliers sur cas réels + tuteur interne) ; statut <b>obligatoire</b> (adaptation au poste, L. 6321-1).","<b>Action 2 – Manager le changement</b> : 4 chefs d’équipe ; objectif : posture de coach de proximité, points d’équipe constructifs, désamorçage des tensions ; atelier présentiel avec jeux de rôles et feedback positif ; statut <b>non obligatoire</b> (développement des compétences).","<b>Argument économique</b> : 18 000 €/trimestre = 72 000 €/an de pertes contre environ 4 500 € de plan de formation ; retour sur investissement en moins d’un mois.","<b>Argument juridique</b> : sanctionner des salariés formés 2 h seulement = risque de licenciement sans cause réelle et sérieuse (manquement à l’obligation de formation).","<b>Argument social</b> : remplacer un démissionnaire coûte 5 000 à 8 000 € ; associer les chefs d’équipe restaure la confiance."],e:"Structure d’une réponse : diagnostic → 2 actions (une métier, une management) avec public, objectif, modalité, statut légal → 2 à 3 arguments chiffrés ou juridiques."},
{t:"10. Cas résolu : enrayer le turnover par la formation",u:["<b>Contexte</b> : PME numérique de 80 salariés ; turnover de 25 % chez les moins de 3 ans d’ancienneté ; causes : manque d’accompagnement et de perspectives.","<b>Chiffrage de la perte</b> : 5 départs par an ≈ 75 000 € de coûts indirects (recrutement, temps de formation perdu, retards de projets), soit ≈ 15 000 € par départ.","<b>Action collective</b> : parcours d’intégration et tutorat interne pour tous les nouveaux.","<b>Action individuelle</b> : modules certifiants sur les technologies émergentes dès la 2e année.","<b>Bilan</b> : plan à 15 000 € ; 3 démissions évitées = 45 000 € d’économie dès l’année 1."],e:"Gain net = 45 000 − 15 000 = 30 000 € (calcul à ajouter dans une copie pour montrer le ROI). Lien avec l’onboarding : le tutorat est le dispositif central."},
{t:"11. Flashcards S1 (question / réponse)",u:["<b>Double obligation ?</b> Adaptation au poste (court terme) + maintien de l’employabilité (moyen/long terme), art. L. 6321-1.","<b>Une formation obligatoire hors temps de travail ?</b> Non : temps de travail effectif, salaire maintenu (L. 6321-2).","<b>Refus d’une formation d’adaptation ?</b> Impossible : faute professionnelle (pouvoir de direction).","<b>Rythme de l’EPP ?</b> 1 – 4 – 8 : initial dans l’année, tous les 4 ans, bilan à 8 ans.","<b>Condition « formation » du bilan ?</b> Au moins une formation non obligatoire (+ 50 salariés) sinon 3 000 € de CPF.","<b>Interdit en EPP ?</b> Évaluer la performance et fixer des objectifs chiffrés.","<b>Pourquoi Qualiopi ?</b> Pour obtenir des fonds publics ou mutualisés (OPCO, CPF, Régions, France Travail)."],e:"Astuce de mémorisation : cache la réponse, formule-la à voix haute, puis compare."}]},

{n:"S2 · Besoins et note d’orientation",s:[
{t:"1. Construire le PDC : 5 étapes",u:["<b>1. Définir la stratégie et analyser les besoins</b> (alignement CODIR, EPP, managers, législation).","<b>2. Fixer les objectifs et prioriser</b> (urgence et impact : maintien dans l’emploi, adaptation au poste, projets stratégiques).","<b>3. Concevoir et budgétiser</b> (fiches-actions, chiffrage, consultation du CSE).","<b>4. Mettre en œuvre</b> (prestataires Qualiopi, convocations, logistique).","<b>5. Suivre et évaluer</b> (tableau de bord, évaluation à chaud et à froid)."],e:"Chaîne de valeur : stratégie d’entreprise → note d’orientation → recueil et arbitrage → PDC opérationnel."},
{t:"2. Les 3 niveaux de besoins",u:["<b>Individuels</b> : un projet d’évolution, une mobilité ou une lacune ciblée. Sources : EPP, demandes directes, bilans.","<b>Collectifs</b> : partagés par une équipe ou un métier. Sources : déploiement d’un outil, réorganisation, dysfonctionnements transverses.","<b>Stratégiques / organisationnels</b> : issus de la direction et de la GEPP. Sources : nouveaux marchés, IA, transition écologique, évolutions réglementaires."],e:"Cas Léa D. (formation gestion de projet, 2 200 €) : si le poste de coordinatrice est prévu dans la GEPP, intégration à 100 % au PDC ; si l’évolution est incertaine, co-construction (CPF de la salariée + abondement employeur)."},
{t:"3. Boîte à outils et filtre « tout-formation »",u:["<b>Outils</b> : EPP, fiche de demande de formation, entretien RH/manager, focus group, grille d’analyse et de criticité (urgence, ROI).","<b>Réflexe</b> : toute demande exprimée n’est pas un besoin de formation.","Équipes qui ne se parlent pas → posture managériale : coaching d’équipe.","Trop d’erreurs d’expédition → process flou : audit de process + formation ciblée.","Collaborateur clé qui s’ennuie → mobilité interne ou élargissement de tâches.","Retards de planning → sous-effectif : recrutement ou révision des charges."],e:"Un manager demande « gestion du temps » car l’équipe rend ses dossiers en retard : ce n’est pas forcément un besoin de formation (charge de travail, organisation)."},
{t:"4. Exploiter un entretien : matrice d’arbitrage",u:["<b>Cas Mehdi B.</b> (agent logistique) : veut devenir chef d’équipe, tensions sur le quai, difficultés sur l’ERP, contrainte budgétaire.","<b>Priorité 1</b> (besoin organisationnel et métier) : atelier pratique ERP et tutorat de poste.","<b>Priorité 2</b> (collectif et managérial) : atelier de communication interpersonnelle.","<b>Priorité 3</b> (individuel et GEPP) : parcours « futur manager », sous condition de validation d’un projet de promotion interne."],e:"Méthode : nature du besoin → priorité dans le temps (court, moyen, long terme) → solution préconisée."},
{t:"5. La note d’orientation RH",u:["<b>Définition</b> : document synthétique de 1 à 2 pages, rédigé par la direction RH pour la DG, les managers et le CSE.","<b>Utilité</b> : traduire la stratégie en priorités de compétences, fixer les critères d’arbitrage <b>avant</b> la collecte, éviter l’effet « liste au Père Noël ».","<b>4 piliers</b> : contexte et enjeux ; enjeux RH et priorités GEPP ; 3 à 4 axes prioritaires de formation ; calendrier et critères d’arbitrage.","<b>Cas Renault Re-Factory</b> : reconversion vers les batteries et le recyclage, industrie 4.0, RSE → axes de reskilling, maintenance prédictive et sécurité."],e:"Alignement NOVALIS : flotte Bio-GNV → écoconduite (non obligatoire) ; WMS 4.0 et IA → qualification (obligatoire L. 6321-1) ; logistique santé → habilitation chaîne du froid (obligatoire) ; climat social → EPP (L. 6315-1)."},
{t:"6. Cas NOVALIS : énoncé et lecture stratégique",u:["<b>Entreprise</b> : NOVALIS Logistique &amp; Services, PME de 140 salariés (Carquefou/Nantes) : 58 conducteurs, 35 préparateurs/agents de quai, 12 chefs d’équipe, 35 administratifs.","<b>Axe business 1</b> : transition énergétique et RSE (25 véhicules Bio-GNV et électriques d’ici 18 mois).","<b>Axe business 2</b> : digitalisation et IA 4.0 (nouveau logiciel logistique, préparation guidée par IA).","<b>Axe business 3</b> : diversification « logistique santé » (marché pharmaceutique réglementé).","<b>Contexte RH</b> : turnover +18 %, climat social dégradé, nouveau cadre de l’EPP.","<b>Mission</b> : pour chaque axe, identifier l’impact compétences, puis rédiger une note d’orientation de 10 à 15 lignes (contexte, 3 axes, critères d’arbitrage)."],e:"Méthode : décision business (CODIR) → compétences concernées → axe du PDC → statut légal."},
{t:"7. Corrigé NOVALIS : note d’orientation rédigée",u:["<b>Flotte Bio-GNV et RSE</b> → conduite propre et sécurité de recharge → Axe 1 écoconduite et sécurité (non obligatoire).","<b>WMS 4.0 et IA</b> → saisie automatisée, pilotage sur terminal tactile → Axe 2 qualification WMS 4.0 en AFEST (obligatoire, L. 6321-1).","<b>Logistique santé/froid</b> → normes ISO 13485, hygiène, traçabilité pharma → Axe 3 habilitation chaîne du froid (obligatoire réglementaire).","<b>Climat social et EPP</b> → écoute, accompagnement des seniors → atelier managers EPP (obligatoire, L. 6315-1).","<b>Critères d’arbitrage</b> : priorité aux formations collectives, à l’AFEST sur poste et aux organismes certifiés Qualiopi."],e:"Extrait de note : « Face aux mutations énergétiques, technologiques et sanitaires de notre secteur, le PDC 2026-2027 accompagne la montée en qualification des équipes sur les véhicules Bio-GNV, l’outil WMS 4.0 et la logistique santé. Il intègre le déploiement des EPP 1-4-8. Priorité aux formations collectives, à l’AFEST et aux organismes Qualiopi. »"},
{t:"8. Cas Renault Re-Factory",u:["<b>Pivots stratégiques</b> : reconversion du site (du thermique vers réparation/recyclage de batteries et reconditionnement), digitalisation par IA et logiciel de stocks 4.0, objectif zéro carbone et RSE.","<b>Re-Factory et économie circulaire</b> → requalification des ouvriers vers le rétrofit et la maintenance de batteries → Axe 1 diagnostic et sécurité haute tension (<b>obligatoire</b>, L. 6321-1).","<b>Industrie 4.0 et IA</b> → pilotage de lignes cobotisées, contrôle qualité automatisé, logiciel d’entrepôt → Axe 2 maintenance prédictive et logiciel (<b>obligatoire</b>).","<b>RSE et sécurité</b> → gestes éco-responsables, prévention des risques chimiques/électriques → Axe 3 secourisme électrique et sensibilisation RSE (<b>non obligatoire</b>, valide le bilan à 8 ans).","<b>Note rédigée</b> : 100 % de l’investissement sur 3 priorités (reconversion, maintenance prédictive assistée par IA, déploiement des EPP pour les seniors) ; les demandes individuelles hors périmètre ne sont pas retenues cette année."],e:"Une note d’orientation assume des refus : c’est ce qui évite la « liste au Père Noël »."},
{t:"9. Pièges, QCM et flashcards S2",u:["<b>Formation de sécurité hors temps de travail si le salarié est d’accord ?</b> Non.","<b>Le bilan à 8 ans exige une formation non obligatoire ?</b> Oui.","<b>L’EPP évalue le chiffre d’affaires ?</b> Non, c’est l’entretien annuel d’évaluation.","<b>Refuser une formation obligatoire d’adaptation</b> = faute professionnelle ? Oui.","<b>Un accord d’entreprise peut-il adapter la périodicité de l’EPP ?</b> Oui (aménageable par accord collectif).","<b>Besoin individuel vs collectif ?</b> Individuel : une personne, un projet ou une lacune ; collectif : une équipe ou un métier face à un enjeu commun.","<b>2 outils de recueil ?</b> EPP, fiche de demande, entretien manager, focus group, grille de criticité.","<b>Pourquoi une note d’orientation avant le recueil ?</b> Pour fixer le cadre et les critères d’arbitrage avant les demandes."],e:"Risque pour une entreprise de 85 salariés sans formation non obligatoire sur 8 ans : abondement correctif de 3 000 € par salarié concerné."}]},

{n:"S3 · Ingénierie",s:[
{t:"1. La fiche-action et les objectifs",u:["<b>Fiche-action</b> : fiche technique d’une formation (pour qui, pourquoi, comment, quel coût). Elle fait le pont entre la note d’orientation et le terrain, sert au cahier des charges, au chiffrage et à l’information du CSE.","<b>Objectif opérationnel</b> (entreprise) : résultat mesurable sur le terrain, au format SMART (indicateur chiffré + délai).","<b>Objectif pédagogique</b> (stagiaire) : « à la fin du stage, il sera capable de… » avec un <b>verbe d’action observable</b> (identifier, utiliser, appliquer, calculer, rédiger, valider).","<b>Bannir</b> : comprendre, connaître, être sensibilisé."],e:"Opérationnel : réduire le taux d’erreur de préparation de 35 % à moins de 2 % sous 60 jours. Pédagogique : scanner et valider les références sur terminal tactile sans erreur."},
{t:"2. Rubriques d’une fiche-action",u:["Intitulé de l’action et <b>axe stratégique</b> de rattachement.","<b>Public visé</b> et effectif.","<b>Objectif opérationnel</b> et <b>objectifs pédagogiques</b>.","<b>Modalité et durée</b>.","<b>Statut légal</b> : obligatoire ou non obligatoire."],e:"CACES R489 : 12 préparateurs, objectif zéro accident, présentiel de 14 h, formation obligatoire (art. L. 6321-2)."},
{t:"3. Choisir la modalité",u:["<b>Présentiel</b> : compétences relationnelles et mises en pratique de groupe (vigilance : coûts et immobilisation des équipes).","<b>Distanciel / e-learning</b> : théorie, cadrage réglementaire, mises à jour simples (risque de démotivation).","<b>Blended</b> : théorie en e-learning puis pratique avec formateur.","<b>AFEST</b> : formation sur le poste réel. 4 conditions : analyse du poste, tuteur formé, phases réflexives hors production, évaluation des acquis écrite.","<b>Attention</b> : placer un nouveau à côté d’un ancien sans grille ni temps d’échange = compagnonnage informel, ni reconnu ni financé."],e:"RGPD pour 50 commerciaux nomades → e-learning ; conflits entre chefs d’équipe → présentiel ; machine spécifique à l’entrepôt → AFEST ; nouvel ERP (théorie + pratique) → blended."},
{t:"4. Acheter : cahier des charges et Qualiopi",u:["<b>Cahier des charges</b> : contexte, public, objectif SMART, durée souhaitée, date limite de réponse.","<b>Qualiopi</b> : obligation légale pour être financé ou co-financé (OPCO, CPF, Région).","<b>3 critères de comparaison des devis</b> : valeur pédagogique de la réponse, qualification du formateur, coût global par stagiaire et souplesse du calendrier."],e:"NOVALIS : 3 exigences = Qualiopi valide, formateur connaissant la logistique d’entrepôt, co-construction d’un guide AFEST pour les chefs d’équipe."},
{t:"5. Budget et audit flash",u:["<b>Coût réel</b> = coûts pédagogiques + salaires maintenus (chargés) + frais annexes (déplacements, hébergement, repas, salle).","<b>Co-financeurs</b> : OPCO (direct pour moins de 50 salariés ; au-delà, FNE-Formation ou accords de branche) ; CPF en co-investissement avec abondement de l’employeur.","<b>5 erreurs du projet bâclé</b> : objectifs flous (« connaître, comprendre ») ; 7 h d’e-learning d’affilée ; organisme non Qualiopi ; budget limité à la facture ; statut légal oublié (adaptation obligatoire, art. L. 6321-1)."],e:"5 stagiaires, 14 h, 25 €/h chargé, facture OF 3 000 € : salaires 5 × 14 × 25 = 1 750 € → coût réel 4 750 € (et non 3 000 €)."}]},

{n:"S4 · Budget, CSE, évaluation",s:[
{t:"1. Budget et tableau de synthèse",u:["<b>Coût global réel</b> = coûts pédagogiques + masse salariale maintenue + frais annexes.","<b>Tableau de synthèse</b> : regroupe les fiches-actions arbitrées (axe, public, objectif SMART, modalité, statut légal, coûts, financement, planning).","<b>Il sert à</b> valider le budget avec la DG, présenter le dossier au CSE et demander les prises en charge OPCO."],e:"NOVALIS : 4 projets, 2 obligatoires et 2 non obligatoires, soit 27 750 € de pédagogie + 41 352 € de salaires maintenus = 69 102 € HT."},
{t:"2. Consultation du CSE",u:["<b>Obligation</b> (50 salariés et plus, art. L. 2312-24) : consultation annuelle sur les orientations de la formation et le PDC.","<b>3 dossiers via la BDESE</b> : bilan N-1 des formations ; note d’orientation et projet de PDC N+1 ; état d’avancement des EPP.","<b>Le CSE rend un avis motivé</b>, sans droit de veto : un avis négatif ne bloque pas les formations mais marque une rupture du dialogue social.","<b>Risque d’oubli</b> : délit d’entrave."],e:"Rétroplanning : mai-juillet cadrage ; sept-oct recueil et arbitrage ; nov-déc conception et consultation CSE ; année N+1 déploiement et évaluation."},
{t:"3. Déploiement et logistique",u:["<b>Convocation</b> au salarié et à son manager, avec un délai de prévenance de 2 à 3 semaines : intitulé, dates, horaires, lieu, programme, accès.","<b>Statut du salarié</b> : formation du PDC sur temps de travail = exécution normale du contrat, salaire maintenu, couverture accident du travail.","<b>Pièces justificatives</b> (contrôle URSSAF/OPCO) : convention de formation, feuilles d’émargement par demi-journée, attestation de fin de formation / certificat de réalisation."],e:"Sans émargement ni convention signée, une prise en charge OPCO peut être refusée."},
{t:"4. Modèle de Kirkpatrick",u:["<b>Niveau 1 – Réaction</b> (à chaud, fin de formation) : satisfaction ; KPI &gt; 85 %.","<b>Niveau 2 – Apprentissage</b> (fin de session) : quiz, QCM, mises en situation ; taux de réussite ou d’obtention de la certification.","<b>Niveau 3 – Comportement</b> (à froid, M+3 à M+6) : transfert sur le poste, grille manager-salarié ; KPI &gt; 80 %.","<b>Niveau 4 – Résultats</b> (M+6 ou fin d’année) : baisse des erreurs, de l’accidentologie, gain de productivité, ROI."],e:"Grille M+3 NOVALIS : taux d’erreur 0,7 % contre 35 % avant formation → objectif atteint ; anomalies de stock en cours → 30 min de tutorat AFEST."},
{t:"5. Tableau de bord et cas NOVALIS",u:["<b>Taux de réalisation des heures</b> = heures réalisées ÷ heures prévues × 100.","<b>Taux d’accès</b> = salariés formés ÷ effectif total × 100.","<b>Budget</b> consommé vs alloué ; co-financements mobilisés (OPCO, FNE, CPF).","<b>Qualité et impact</b> : satisfaction à chaud, transfert à M+3.","<b>Anomalies du cas (30 juin)</b> : 70 % du budget engagé pour 32 % des heures réalisées ; accès cadres 85 % vs ouvriers 15 % ; seulement 20 % des évaluations à froid retournées."],e:"Risque : inégalité d’accès, donc formations non obligatoires manquantes pour les ouvriers et sanction du bilan EPP à 8 ans (3 000 € de CPF par salarié). Actions : rééquilibrer vers les ouvriers, replanifier les sessions, relancer les managers sur les grilles M+3."},
{t:"6. À retenir pour l’évaluation (1 h)",u:["Format : <b>QCM complexe</b> et <b>cas pratiques courts</b>.","Connaître <b>L. 6321-1</b> (double obligation), <b>L. 6321-2</b> (obligatoire / non obligatoire) et le <b>1-4-8</b> avec la sanction de 3 000 €.","Savoir distinguer les <b>objectifs opérationnels et pédagogiques</b> et rédiger en SMART avec des verbes d’action.","Savoir choisir une <b>modalité</b> et justifier (AFEST, blended).","Calculer un <b>coût global réel</b> et citer les co-financeurs.","Connaître la <b>consultation du CSE</b> (avis, pas de veto) et les <b>4 niveaux de Kirkpatrick</b>."],e:"Méthode de réponse à un cas : diagnostic → type de besoin → action, statut légal et modalité → budget → indicateurs."}]}
];
let d=0,i=0;const $=id=>document.getElementById(id);
function render(){const k=D[d],s=k.s[i];
$("deckname").textContent="Fiche "+(d+1)+" : "+k.n;$("count").textContent="Slide "+(i+1)+" / "+k.s.length;
$("prog").style.width=((i+1)/k.s.length*100)+"%";
$("slide").innerHTML="<h2>"+s.t+"</h2><p class='sub'>"+k.n+" · Plan de développement des compétences · Bachelor RH</p><ul>"+s.u.map(x=>"<li>"+x+"</li>").join("")+"</ul>"+(s.e?"<div class='ex'><strong>Exemple / à retenir :</strong> "+s.e+"</div>":"");
$("prev").disabled=i===0;$("next").disabled=i===k.s.length-1;
$("dots").innerHTML=k.s.map((_,j)=>"<button class='"+(j===i?"on":"")+"' aria-label='Slide "+(j+1)+"' data-j='"+j+"'></button>").join("");
document.querySelectorAll("#tabs button").forEach((b,j)=>b.setAttribute("aria-selected",j===d));}
$("tabs").innerHTML=D.map((k,j)=>"<button role='tab' data-d='"+j+"'>"+k.n+"</button>").join("");
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){d=+b.dataset.d;i=0;render();window.scrollTo(0,0)}};
$("dots").onclick=e=>{const b=e.target.closest("button");if(b){i=+b.dataset.j;render()}};
$("prev").onclick=()=>{if(i>0){i--;render()}};$("next").onclick=()=>{if(i<D[d].s.length-1){i++;render()}};
document.onkeydown=e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()};
render();
</script>
</body>
</html>
